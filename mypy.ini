# Typing gate. Run from the repository root:  python3 -m mypy
# Checks the rules_port and application packages. Other modules are followed silently, so their
# errors are not reported until they are added to ``files``.
[mypy]
files = rules_port, application
follow_imports = silent
ignore_missing_imports = True

# rules_port is held to the stricter check: the bodies of untyped functions are checked too.
# application is not yet; its untyped bodies carry most of its remaining reports.
[mypy-rules_port.*]
check_untyped_defs = True
