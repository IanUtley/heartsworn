<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartsworn Battle</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <section id="home" class="screen">
    <canvas id="home-scene" class="hidden" aria-hidden="true"></canvas>
    <div class="home-panel">
      <h1>Heartsworn</h1>
      <p class="subtitle">Hex: Shards of Fate, in the browser</p>
      <nav class="home-nav">
        <button id="nav-battle" class="primary">Battle</button>
        <button id="nav-collection" class="primary">Collection</button>
        <button id="nav-settings" class="secondary">Settings</button>
      </nav>
      <div id="settings-panel" class="settings-panel hidden">
        <h2>Settings</h2>
        <div class="settings-folder">
          <p id="settings-folder-status" class="status"></p>
          <button id="settings-folder" class="secondary">Choose Hex folder&hellip;</button>
        </div>
        <label>Background <select id="home-background"></select></label>
        <button id="settings-close" class="secondary">Close</button>
      </div>
    </div>
  </section>

  <section id="collection" class="screen hidden">
    <div class="collection-page">
      <header class="collection-head">
        <h1>Collection</h1>
        <button id="collection-home" class="secondary">Main page</button>
      </header>
      <div class="collection-body">
        <div class="collection-browse">
          <div class="collection-tools">
            <input id="collection-search" placeholder="Search cards" aria-label="Search cards">
            <select id="collection-sort" aria-label="Sort cards">
              <option value="name">Name</option>
              <option value="cost">Cost</option>
            </select>
          </div>
          <div id="collection-grid" class="collection-grid"></div>
        </div>
        <aside class="deck-editor">
          <div class="deck-toolbar">
            <select id="deck-select" aria-label="Saved decks"></select>
            <button id="deck-new" class="secondary">New deck</button>
          </div>
          <label>Name <input id="deck-name" maxlength="40"></label>
          <label>Format <select id="deck-format" aria-label="Deck format"></select></label>
          <label>Champion <select id="deck-champion"></select></label>
          <p id="deck-count" class="status"></p>
          <ul id="deck-errors" class="deck-errors" aria-live="polite"></ul>
          <div id="deck-stats" class="deck-stats"></div>
          <div id="deck-list" class="deck-list"></div>
          <div class="buttons">
            <button id="deck-save" class="primary">Save deck</button>
            <button id="deck-delete" class="secondary">Delete</button>
          </div>
          <p id="deck-status" class="status"></p>
        </aside>
      </div>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="lobby-panel">
      <h1>Heartsworn</h1>
      <p class="subtitle">Hex: Shards of Fate, in the browser</p>
      <div class="client-folder">
        <p>Point to your <b>HEX SHARDS OF FATE</b> folder. Card art, card sounds and
          battleboards are read from it in this page and never uploaded.</p>
        <button id="pick-folder" class="secondary">Choose Hex folder&hellip;</button>
        <button id="change-folder" class="secondary" hidden>Choose a different folder&hellip;</button>
        <input type="file" id="folder-input" webkitdirectory hidden>
        <p id="folder-status" class="status"></p>
      </div>
      <label>Your name <input id="player-name" maxlength="32" value="You"></label>
      <div class="deck-pickers">
        <label>Your deck
          <select id="deck-mine"></select>
        </label>
        <label>Opponent (server AI)
          <select id="deck-theirs"></select>
        </label>
      </div>
      <div class="cosmetics">
        <label>Card sleeve <select id="sleeve-choice"></select></label>
        <label>Gameboard <select id="board-choice"></select></label>
        <label>Sound volume <input type="range" id="volume-choice" min="0" max="100" step="5"> <span id="volume-value"></span></label>
      </div>
      <div class="buttons"><button id="lobby-home" class="secondary">Main page</button><button id="start-match" class="primary">Battle</button></div>
      <p id="lobby-status" class="status"></p>
    </div>
  </section>

  <section id="battle" class="screen hidden">
    <div id="board">
      <div id="board3d"></div>
      <div id="table">
        <div class="plane">
          <div class="zone-row warzone" id="opp-warzone"></div>
          <div id="centre">
            <div class="firebar left"></div><div class="firebar right"></div>
            <div id="medallion"><div class="plate"></div><div class="coin" id="medallion-glyph"></div></div>
            <div class="chain-label">Chain</div>
            <div class="chain-items" id="chain"></div>
          </div>
          <div class="zone-row warzone" id="my-warzone"></div>
        </div>
      </div>

      <div class="hand-row" id="opp-hand"></div>
      <div class="hand-row" id="my-hand"></div>
      <div class="champion-slot opp">
        <div id="opp-champion"></div>
        <div class="zone-row resources" id="opp-resources"></div>
      </div>
      <div class="champion-slot me">
        <div class="zone-row resources" id="my-resources"></div>
        <div id="my-champion"></div>
      </div>
      <div class="piles opp" id="opp-piles"></div>
      <div class="piles me" id="my-piles"></div>
      <div id="phase-dial"><div id="phase-track"></div><div id="phase-label"></div></div>

      <div id="action-panel">
        <div id="prompt-text"></div>
        <div id="action-buttons"></div>
      </div>
      <div id="preview"></div>
      <div id="log"></div>
      <button id="menu-button" title="Menu">&#9881;</button>
    </div>
  </section>

  <div id="modal" class="hidden"><div class="modal-card" id="modal-body"></div></div>
</div>
<script type="module" src="/static/hex_assets.js"></script>
<script type="module" src="/static/board3d.js"></script>
<script src="/static/app.js"></script>
<script src="/static/home.js"></script>
</body>
</html>
