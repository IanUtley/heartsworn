<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ability Editor</title>
<style>
  /* The same palette as style.css (dark by default, light when the system asks for it),
     so the editor matches the card page it is embedded in. */
  :root { --bg: #11161b; --panel: #182028; --panel-2: #1f2a34; --text: #e7edf1; --muted: #93a4b0;
    --line: #2c3a46; --accent: #5cc8ff; --kw: #ffb020; --bad: #ff6b6b; --ok: #4fd18b; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #eef2f5; --panel: #ffffff; --panel-2: #f3f6f8; --text: #17212a;
      --muted: #5d6b76; --line: #d6dee4; --accent: #0b6fa4; --kw: #9a5b00; --bad: #b3261e; --ok: #1e7a45; color-scheme: light; }
  }
  :root[data-theme="light"] { --bg: #eef2f5; --panel: #ffffff; --panel-2: #f3f6f8; --text: #17212a;
    --muted: #5d6b76; --line: #d6dee4; --accent: #0b6fa4; --kw: #9a5b00; --bad: #b3261e; --ok: #1e7a45; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }

  /* Every control states its own colours: a native option list otherwise keeps the
     system's colours and can end up dark-on-dark or light-on-light. */
  input, select, option, optgroup, textarea, button { font: inherit; color: var(--text); background-color: var(--panel-2); }
  input, select, textarea, button { border: 1px solid var(--line); border-radius: 5px; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  button { padding: 3px 9px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  a.button { display: inline-block; padding: 3px 9px; border: 1px solid var(--line); border-radius: 5px; background-color: var(--panel-2); color: var(--text); text-decoration: none; }
  a.button:hover { border-color: var(--accent); }

  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar h1 { font-size: 15px; margin: 0 6px 0 0; }
  .bar input { padding: 3px 7px; flex: 1 1 220px; min-width: 0; font-family: ui-monospace, monospace; font-size: 12px; }
  .status { flex: 1 1 100%; color: var(--muted); font-size: 12px; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  main { padding: 10px 12px 16px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  .hidden { display: none !important; }
  .note { color: var(--muted); font-size: 13px; }
  .reasons li, .problems li { color: var(--bad); }
  .problems { margin: 6px 0 0; padding-left: 18px; font-size: 12px; }
  .problems:empty { display: none; }

  /* The pseudocode: one line per clause, each value an inline control. */
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .meta label { display: inline-flex; gap: 4px; align-items: center; flex: 1 1 200px; min-width: 0; }
  .meta input { flex: 1; min-width: 0; padding: 1px 6px; font-size: 12px; }
  .code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 6px 4px; }
  .line { display: flex; align-items: flex-start; gap: 4px; padding: 2px 4px; border-radius: 5px; }
  .line:hover { background: var(--panel-2); }
  .line .tools { flex: none; display: inline-flex; gap: 1px; visibility: hidden; }
  .line:hover .tools, .line:focus-within .tools { visibility: visible; }
  .tools button { padding: 0 4px; font-size: 11px; line-height: 18px; border-color: transparent; background: transparent; color: var(--muted); }
  .tools button:hover:not(:disabled) { color: var(--text); }
  .stmt { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 5px; line-height: 24px; }
  .clause-line .stmt { padding-left: 18px; }
  .kw { color: var(--kw); font-weight: 600; }
  .word { color: var(--text); }
  .faint { color: var(--muted); }
  .stmt input, .stmt select { font: inherit; font-size: 12px; padding: 0 4px; height: 21px; max-width: 100%;
    border-color: transparent; border-bottom: 1px dashed var(--accent); border-radius: 3px; color: var(--accent); }
  .stmt input:hover, .stmt select:hover { border-color: var(--line); border-bottom-color: var(--accent); }
  .stmt input.empty, .stmt select.empty { color: var(--muted); border-bottom-color: var(--line); }
  .stmt select.shape, .stmt select.kw { color: var(--kw); font-weight: 600; border-bottom-color: var(--kw); }
  .stmt input[type=checkbox] { height: auto; }
  .extras { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 12px; color: var(--muted); padding: 2px 0 4px; }
  .extras label { display: inline-flex; gap: 4px; align-items: center; }
  .add { margin: 4px 0 0 22px; font-size: 12px; padding: 1px 8px; }
  .empty-note { padding: 2px 4px 2px 22px; }

  details.text-pane { margin-top: 12px; }
  iframe.ir-frame { width: 100%; height: 60vh; min-height: 320px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  details.text-pane > summary { cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  textarea { width: 100%; min-height: 130px; resize: vertical; padding: 6px 8px; font-family: ui-monospace, monospace; font-size: 12px; }

  /* Inside the card page the card editor already names the page. */
  html.embedded .bar h1 { display: none; }
</style>
</head>
<body>
<header class="bar">
  <h1>Ability Editor</h1>
  <input id="guid" type="text" placeholder="ability GUID" aria-label="Ability GUID">
  <button id="open" type="button">Open</button>
  <button id="new" type="button">New</button>
  <button id="save" type="button" class="primary" disabled>Save</button>
  <a id="ir-link" class="button" href="/ir" target="_blank" rel="noopener" title="Open this ability in the IR editor">IR editor</a>
  <span id="status" class="status">Enter an ability GUID, or start a new one.</span>
</header>

<main>
  <div id="form-empty" class="note hidden">This ability has no form: the sentences cannot show all of it, so it can only be edited in the field editor.<ul id="reasons" class="reasons"></ul></div>
  <section id="form" aria-label="Ability as pseudocode">
    <div class="meta">
      <label>settings <input id="settings" type="text" placeholder="charge cost 2, manual, 1 per game"></label>
      <label>requires <input id="requires" type="text" placeholder="you have 1 ruby threshold"></label>
    </div>
    <div class="code" id="code">
      <div class="line trigger-line"><span class="tools"></span><span class="stmt"><span class="kw">WHEN</span><select id="trigger" aria-label="Trigger"></select></span></div>
      <div id="clauses"></div>
      <button id="add-clause" type="button" class="add">+ clause</button>
    </div>
  </section>
  <ul id="problems" class="problems"></ul>

  <details class="text-pane" id="text-pane" open>
    <summary>Sentences (DSL text)</summary>
    <textarea id="sentences" spellcheck="false" placeholder="When this enters play, draw a card." aria-label="Sentences"></textarea>
  </details>

  <details class="text-pane" id="ir-pane">
    <summary>IR surface code (saved ability)</summary>
    <iframe id="ir-frame" class="ir-frame" title="IR surface code" src="about:blank"></iframe>
  </details>
</main>

<script src="/static/ability.js"></script>
</body>
</html>
